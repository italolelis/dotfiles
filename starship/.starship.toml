# Starship prompt — Omarchy's minimal look, plus the context worth having:
# kubernetes context, slow-command duration, and the hostname over ssh.
#
#   .dotfiles feat/omarchy ✘ ! ? ⎈ homelab took 5s
#   ❯
#
# Used on every machine via STARSHIP_CONFIG (bash/.bashrc), so it replaces
# Omarchy's ~/.config/starship.toml.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 200
format = "$hostname$directory$git_branch$git_status$kubernetes$cmd_duration$line_break$character"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# Full branch name: truncating turned feat/omarchy into "feat".
[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

# Plain ASCII markers, readable without a Nerd Font.
[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "cyan"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
conflicted = "= "
untracked = "? "
modified = "! "
staged = "+ "
deleted = "✘ "
renamed = "» "
stashed = "≡ "

# Only when it tells you something: you are on another machine.
[hostname]
ssh_only = true
format = "[$hostname](bold yellow) "

# Disabled by default in starship; on so the homelab context is always visible.
[kubernetes]
disabled = false
format = '[⎈ $context]($style) '
style = "blue"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "yellow"
