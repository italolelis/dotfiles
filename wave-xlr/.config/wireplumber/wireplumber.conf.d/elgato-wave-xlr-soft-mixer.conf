# The Elgato Wave XLR reports a broken hardware mixer ("broken mixer GET_CUR"),
# and PipeWire writing to it leaves the mic delivering silence after reconnects
# (e.g. KVM switches). Use software volume so the hardware mixer is never touched.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card\\.usb-Elgato_Systems_Elgato_Wave_XLR_.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
